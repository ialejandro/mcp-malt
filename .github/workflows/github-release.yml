name: Create release

permissions: {}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Work out the next version and print it, without publishing'
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  release:
    name: Create tag release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write

    steps:
      # npmjs needs no secret: it trusts this workflow through OIDC (id-token: write).
      - name: Check the required secrets exist
        env:
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
        run: |
          if [ -z "$PAT_GITHUB" ]; then
            echo "PAT_GITHUB is empty. Add it under Settings > Secrets and variables > Actions"
            echo "as a repository secret (an Environment or Dependabot secret is not visible here)."
            echo "It needs a classic PAT with repo and write:packages scopes."
            exit 1
          fi
          echo "PAT_GITHUB is present."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_GITHUB }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before publishing
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          branch: main
          tag_format: v${version}
          dry_run: ${{ inputs.dry_run || false }}
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Publish to GitHub Packages
        if: steps.semantic_release.outputs.new_release_published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_GITHUB }}
        run: |
          version="${{ steps.semantic_release.outputs.new_release_version }}"
          npm pkg set version="$version"
          npm pkg delete publishConfig.registry
          {
            echo "@ialejandro:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}"
          } >> .npmrc
          npm publish --registry=https://npm.pkg.github.com --provenance=false

      - name: Summarise
        run: |
          {
            if [ "${{ steps.semantic_release.outputs.new_release_published }}" = "true" ]; then
              version="${{ steps.semantic_release.outputs.new_release_version }}"
              echo "## Released v${version}"
              echo
              echo "- npmjs: \`npx -y @ialejandro/mcp-malt@${version}\`"
              echo "- GitHub Packages: \`@ialejandro/mcp-malt@${version}\`"
              echo "- image: building now from tag \`v${version}\`"
            else
              echo "## No release"
              echo
              echo "No releasable commits since the last tag. feat, fix and perf cut a release;"
              echo "chore, docs, test, refactor and style do not."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
